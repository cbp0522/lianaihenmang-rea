name: 本地兼容性与产品验收

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: bash tools/check.sh
      - name: 编译原创 iOS 产品
        run: |
          bash tools/build-ios.sh product simulator "$RUNNER_TEMP/focus-sim"
