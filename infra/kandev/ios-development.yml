version: 2
type: kandev_workflow
workflows:
  - name: iOS 研究与原创开发（三角色）
    description: Gemini 负责研究和文档，Claude 负责产品架构与独立审查，Codex 负责实现、验收和 Draft PR。
    steps:
      - name: Gemini 研究与初版 PRD
        position: 0
        color: bg-sky-500
        is_start_step: true
        allow_manual_move: true
        wip_limit: 1
        auto_advance_requires_signal: true
        complete_task_on_enter: false
        agent_profile: &claude {agent_name: Claude, model: default, mode: auto}
        profile_session_start_policy: new
        events:
          on_enter: &run [{type: auto_start_agent}]
          on_turn_complete: [{type: move_to_step, config: {step_position: 1}}]
        prompt: |
          {{task_prompt}}

          你是本机 Antigravity 的调用和存档操作员，Gemini 是本步骤的文档作者。用 mktemp -d 建仓库外临时目录。运行 /usr/bin/python3 tools/agents.py document --phase initial --input "<研究证据摘要>" --input "<PRD 文件>" --input "<开发任务文件>" --out "<临时目录>"。只有提交时没提供摘要才省略第一项。用 create_task_plan_kandev 保存完整 Gemini-initial.md，并用 step_complete_kandev 交接研究证据、初稿范围和实机未知项。不要在仓库提交研究资料。模型失败时停在该步骤，避免代写。
      - name: Claude 产品与技术架构
        position: 1
        color: bg-violet-500
        allow_manual_move: true
        auto_advance_requires_signal: true
        complete_task_on_enter: false
        agent_profile: *claude
        profile_session_start_policy: new
        events:
          on_enter: *run
          on_turn_complete: [{type: move_to_step, config: {step_position: 2}}]
        prompt: |
          {{task_prompt}}

          以产品和架构负责人在新会话用 get_task_plan_kandev 读取 Gemini 初稿，查看已有实现、测试入口与目标平台。设计首发切片、交互、主应用和未来键盘扩展、共享容器与权限降级、数据模型、AI 或网络边界及测试。遵守开发简报范围。将简体中文原创设计写到任务允许的架构文件。用 update_task_plan_kandev append 追加「Claude 架构决定」及文件位置、验收条件，然后 step_complete_kandev。此步骤不实现代码。
      - name: Gemini 规格与开发验收
        position: 2
        color: bg-sky-600
        allow_manual_move: true
        auto_advance_requires_signal: true
        complete_task_on_enter: false
        agent_profile: *claude
        profile_session_start_policy: new
        events:
          on_enter: *run
          on_turn_complete: [{type: move_to_step, config: {step_position: 3}}]
        prompt: |
          {{task_prompt}}

          以 Antigravity 调用和存档操作员身份读取 get_task_plan_kandev 的「Claude 架构决定」及仓库内架构文件。用 /usr/bin/python3 tools/agents.py document --phase handoff --input "<架构文件>" --input "<整理好的原创范围或开发任务文件>" --out "<仓库外临时目录>" 交给 Gemini。核对并保存完整 Gemini-handoff.md 为任务允许的 PRD 与验收文档，用 update_task_plan_kandev append 追加「Gemini 开发交接」附文档路径和验收，使用 step_complete_kandev。保留 Gemini 作者与架构来源。此步骤只写原创文档，不提交竞品资料。
      - name: Codex 开发与测试
        position: 3
        color: bg-blue-500
        allow_manual_move: true
        wip_limit: 1
        auto_advance_requires_signal: true
        complete_task_on_enter: false
        agent_profile: &codex {agent_name: Codex, model: gpt-6.2-sol, mode: agent}
        profile_session_start_policy: new
        events:
          on_enter: *run
          on_turn_complete: [{type: move_to_step, config: {step_position: 4}}]
        prompt: |
          {{task_prompt}}

          先用 get_task_plan_kandev 读取 Claude 架构和 Gemini 开发交接，再读取两份工作树文档。核对前阶段两个原创文档存在并引用其关键决定。只在独立非主分支工作树实施范围。运行仓库检查、编译及任务验收，修复自己发现的失败。仅暂存并提交任务代码、测试和两个原创文档。调用 step_complete_kandev 交接 HEAD、验证命令与实际结果，注明未实测项。此步骤不推送。
      - name: Claude 独立审查
        position: 4
        color: bg-amber-500
        allow_manual_move: true
        auto_advance_requires_signal: true
        complete_task_on_enter: false
        agent_profile: *claude
        profile_session_start_policy: new
        events:
          on_enter: *run
          on_turn_complete: [{type: move_to_step, config: {step_position: 5}}]
        prompt: |
          {{task_prompt}}

          以独立审查负责人用 get_task_plan_kandev 和仓库架构、PRD、实际基线差异与验收结果审查本次提交。优先验证输入与粘贴板边界、编译与 UI 测试的真实性。用 update_task_plan_kandev append 追加「Claude 独立审查」，明确通过或需修复、实际复现、位置、影响与验收方法。发现问题由 Codex 修改；未发现则如实记录。这一步只读代码。用 step_complete_kandev 交接提交和结论。
      - name: Codex 反馈修复与复测
        position: 5
        color: bg-orange-500
        allow_manual_move: true
        auto_advance_requires_signal: true
        complete_task_on_enter: false
        agent_profile: *codex
        profile_session_start_policy: new
        events:
          on_enter: *run
          on_turn_complete: [{type: move_to_step, config: {step_position: 6}}]
        prompt: |
          {{task_prompt}}

          用 get_task_plan_kandev 读取「Claude 独立审查」。有可复现问题则实施一轮修复，运行针对性测试和仓库检查，提交任务内范围；通过则保留原提交。用 update_task_plan_kandev append 保存「Codex 修复与验证」及精确 HEAD、实际测试、未验证项。验收通过用 step_complete_kandev。失败停在此处。
      - name: Claude 复核
        position: 6
        color: bg-yellow-500
        allow_manual_move: true
        auto_advance_requires_signal: true
        complete_task_on_enter: false
        agent_profile: *claude
        profile_session_start_policy: new
        events:
          on_enter: *run
          on_turn_complete: [{type: move_to_step, config: {step_position: 7}}]
        prompt: |
          {{task_prompt}}

          只读核对原审查意见、修复记录、实际差异与测试。无代码变更时只核对原审查与 HEAD。有阻断问题则留证并停下。通过则用 step_complete_kandev 交接复核通过的精确提交与结果。
      - name: Gemini 最终文档
        position: 7
        color: bg-sky-700
        allow_manual_move: true
        auto_advance_requires_signal: true
        complete_task_on_enter: false
        agent_profile: *claude
        profile_session_start_policy: new
        events:
          on_enter: *run
          on_turn_complete: [{type: move_to_step, config: {step_position: 8}}]
        prompt: |
          {{task_prompt}}

          用 get_task_plan_kandev 读修复与验证，核对通过的 HEAD，汇总实际代码、运行命令和测试到仓库外文本。运行 /usr/bin/python3 tools/agents.py document --phase final --input "<真实交付摘要>" --input "<原架构或 PRD>" --out "<临时目录>"。只把 Gemini-final.md 更新至任务允许的原创最终文档，核对内容与代码一致。提交严格限 Markdown 文档。用 step_complete_kandev 交接复核的代码提交、文档提交及测试状态。
      - name: 原生 Draft PR
        position: 8
        color: bg-indigo-500
        allow_manual_move: true
        auto_advance_requires_signal: true
        complete_task_on_enter: false
        agent_profile: *codex
        profile_session_start_policy: new
        events:
          on_enter: *run
          on_turn_complete: [{type: move_to_step, config: {step_position: 9}}]
        prompt: |
          {{task_prompt}}

          只向 cbp0522/lianaihenmang-rea 发布。核对独立工作树干净、分支非主分支、HEAD 为 Gemini 文档提交、从 Claude 复核的代码提交到 HEAD 只有任务范围 Markdown。核对授权目标基线。Git HTTPS 可用 git -c 'credential.helper=!gh auth git-credential' push。显式 gh pr create --draft 指定仓库、来源和目标基线，必要时复用已有 Draft。核对 isDraft 和 headRefOid 后立刻 step_complete_kandev 交接 URL 和 SHA，让下阶段核对 CI。没有自动合并和生产发布。
      - name: CI
        position: 9
        color: bg-cyan-500
        allow_manual_move: true
        auto_advance_requires_signal: true
        complete_task_on_enter: false
        agent_profile: *codex
        profile_session_start_policy: new
        events:
          on_enter: *run
          on_turn_complete: [{type: move_to_step, config: {step_position: 10}}]
        prompt: |
          {{task_prompt}}

          核对刚创建的 Draft PR、当前 HEAD 和对应的 GitHub Actions 结果。允许等待最多 15 分钟；检查尚未登记时稍后重查。完整成功后 step_complete_kandev 交接流水线链接、提交哈希和已验证检查。若失败，读取真实日志并留下失败步骤和可复现原因，停在本步骤。不得合并和发布。
      - name: 已验收，等人工决定
        position: 10
        color: bg-green-500
        allow_manual_move: true
        complete_task_on_enter: true
        events: {}
